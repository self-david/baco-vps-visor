services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      LOG_LEVEL: warning
      POST: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "1"
      LOGS: "1"
      NETWORKS: "1"
      NODES: "1"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "1"
      SESSION: "0"
      SWARM: "1"
      SYSTEM: "0"
      TASKS: "1"
      VOLUMES: "0"
      EVENTS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  traefik:
    image: traefik:v3.7.17
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=tcp://docker-proxy:2375
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=vps-manager-proxy
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  manager:
    image: vps-manager:0.1.0
    environment:
      PORT: "3000"
      DOCKER_API_URL: http://docker-proxy:2375
      COOKIE_SECURE: "false"
    secrets:
      - admin_credentials
      - session_key
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=vps-manager-proxy
        - traefik.http.routers.vps-manager.rule=Host(`${VPS_MANAGER_DOMAIN}`)
        - traefik.http.routers.vps-manager.entrypoints=web
        - traefik.http.services.vps-manager.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: vps-manager-proxy

secrets:
  admin_credentials:
    external: true
    name: vps_manager_admin_credentials
  session_key:
    external: true
    name: vps_manager_session_key
