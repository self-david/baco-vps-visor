services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      LOG_LEVEL: warning
      POST: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "1"
      LOGS: "1"
      NETWORKS: "1"
      NODES: "1"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "1"
      SESSION: "0"
      SWARM: "1"
      SYSTEM: "0"
      TASKS: "1"
      VOLUMES: "0"
      EVENTS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
      labels:
        - vps-manager.managed=true
        - vps-manager.component=docker-proxy

  traefik:
    image: traefik:v3.7.17
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=tcp://docker-proxy:2375
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=vps-manager-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.vpsmanager.acme.email=${VPS_MANAGER_EMAIL}
      - --certificatesresolvers.vpsmanager.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.vpsmanager.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - traefik-data:/letsencrypt
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
      labels:
        - vps-manager.managed=true
        - vps-manager.component=ingress

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: vps_manager
      POSTGRES_USER: vps_manager
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vps_manager -d vps_manager"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      labels:
        - vps-manager.managed=true
        - vps-manager.component=database

  manager:
    image: vps-manager:${VPS_MANAGER_IMAGE_TAG:-0.1.0}
    environment:
      PORT: "3000"
      DOCKER_API_URL: http://docker-proxy:2375
      COOKIE_SECURE: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: vps_manager
      DATABASE_USER: vps_manager
      BACKUP_DIRECTORY: /var/backups/vps-manager
      WEB_UPDATE_DIRECTORY: /var/lib/vps-manager/web-update
      VPS_MANAGER_DOMAIN: ${VPS_MANAGER_DOMAIN}
      VPS_MANAGER_TEST_MODE: "false"
      VPS_MANAGER_GITHUB_REPOSITORY: ${VPS_MANAGER_GITHUB_REPOSITORY:-}
    secrets:
      - admin_credentials
      - session_key
      - postgres_password
      - backup_key
    volumes:
      - type: bind
        source: /var/lib/vps-manager/backups
        target: /var/backups/vps-manager
      - type: bind
        source: /var/lib/vps-manager/web-update
        target: /var/lib/vps-manager/web-update
      - type: bind
        source: /var/lib/vps-manager/service-operations
        target: /var/lib/vps-manager/service-operations
    networks:
      - proxy
      - internal
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 30s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 30s
        order: start-first
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
      labels:
        - vps-manager.managed=true
        - vps-manager.component=api
        - traefik.enable=true
        - traefik.swarm.network=vps-manager-proxy
        - traefik.http.routers.vps-manager.rule=Host(`${VPS_MANAGER_DOMAIN}`)
        - traefik.http.routers.vps-manager.entrypoints=websecure
        - traefik.http.routers.vps-manager.tls=true
        - traefik.http.routers.vps-manager.tls.certresolver=vpsmanager
        - traefik.http.services.vps-manager.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: vps-manager-proxy
  internal:
    external: true
    name: vps-manager-internal

volumes:
  traefik-data:
    name: vps-manager-traefik-data
  postgres-data:
    name: vps-manager-postgres-data

secrets:
  admin_credentials:
    external: true
    name: vps_manager_admin_credentials
  session_key:
    external: true
    name: vps_manager_session_key
  postgres_password:
    external: true
    name: vps_manager_postgres_password
  backup_key:
    external: true
    name: vps_manager_backup_key
