name: Publish VPS Manager release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(git show "${RELEASE_TAG}:apps/manager/VERSION")" == "${version}" ]]

      - name: Package source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix=vps-manager/ "${RELEASE_TAG}" \
            > dist/vps-manager-source.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" dist/vps-manager-source.tar.gz \
            --title "VPS Manager ${RELEASE_TAG}" \
            --generate-notes
